name: Пересборка сайта

# Срабатывает, когда меняются данные или файлы (в том числе через admin.html),
# пересобирает страницы и коммитит результат. GitHub Pages сам опубликует.
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'files/**'
      - 'img/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Закоммитить собранные страницы
        run: |
          git config user.name "site-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Страницы не изменились"
          else
            git commit -m "Пересборка сайта"
            git pull --rebase origin main
            git push
          fi
